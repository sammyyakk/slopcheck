<svg width="880" height="20" viewBox="0 0 880 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <style>
      <![CDATA[
        .track { stroke: #1f2937; stroke-width: 1; }
        .beam {
          animation: sweep 4s linear infinite;
        }
        @keyframes sweep {
          0%   { transform: translateX(-220px); }
          100% { transform: translateX(880px); }
        }
      ]]>
    </style>
  </defs>
  <line class="track" x1="0" y1="10" x2="880" y2="10"/>
  <rect class="beam" x="0" y="8" width="220" height="4" fill="url(#sweep)"/>
</svg>
